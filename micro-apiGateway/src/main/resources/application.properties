spring.application.name=micro-apiGateway
server.port=9000

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
# Gateway Routes

spring.cloud.gateway.server.webmvc.routes[0].id=employee-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://MICRO-EMPLOYEE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/employee/**

spring.cloud.gateway.server.webmvc.routes[1].id=account-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://MICRO-ACCOUNT
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/account/**

spring.cloud.gateway.server.webmvc.routes[2].id=plot-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://MICRO-PLOT
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/plot/**